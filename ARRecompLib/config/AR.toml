# XenonRecomp configuration for SSX (Xbox 360, 2012, title 454108CE).
[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "AR_switch_tables.toml"

# Register save/restore helpers, found with the byte patterns from the XenonRecomp README (each matched once).
restgprlr_14_address = 0x82354EC0
savegprlr_14_address = 0x82354E70
restfpr_14_address = 0x82883C1C
savefpr_14_address = 0x82883BD0
restvmx_14_address = 0x82884698
savevmx_14_address = 0x82884400
restvmx_64_address = 0x8288472C
savevmx_64_address = 0x82884494

# setjmp/longjmp are redirected to native implementations. setjmp is the CRT's (the same register stores as other
# titles' after a check of a global hook); longjmp matches other titles' word for word but for one relative call.
longjmp_address = 0x828854D0
setjmp_address = 0x828857F0

# Leaf functions (no .pdata) the analyzer ends too early. 834CCCB0 classifies characters in a loop through a jump
# table; the loop's back edge at 834CCF5C looked like the end, so its default and return cases fell outside.
functions = [
    { address = 0x834CCCB0, size = 0x2D0 },
]

# A rider's update (sub_82964448) reads a state block's data through its first word at two places; with fast loading
# another thread can still be attaching that data. When it's null, go on with the next block as these paths do
# (82964B00). See kernel/title_hooks.cpp.
[[midasm_hook]]
name = "RiderDataMissingHook"
address = 0x82964A50
registers = ["r3"]
jump_address_on_true = 0x82964B00

[[midasm_hook]]
name = "RiderDataMissingHook"
address = 0x82964AE4
registers = ["r3"]
jump_address_on_true = 0x82964B00
