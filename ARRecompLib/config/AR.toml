# XenonRecomp configuration for Anarchy Reigns (Xbox 360).
[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "AR_switch_tables.toml"

# Register save/restore helpers, found with the byte patterns from the XenonRecomp README (each matched once).
restgprlr_14_address = 0x8244ABA0
savegprlr_14_address = 0x8244AB50
restfpr_14_address = 0x8244B2BC
savefpr_14_address = 0x8244B270
restvmx_14_address = 0x8244B808
savevmx_14_address = 0x8244B570
restvmx_64_address = 0x8244B89C
savevmx_64_address = 0x8244B604

# setjmp/longjmp are redirected to native implementations. longjmp restores f14-f31, r13-r31, v64-v127, lr, cr and
# r1 from the jmp_buf and is one of the two callers of RtlUnwind; setjmp is the only function saving that layout.
longjmp_address = 0x825664C0
setjmp_address = 0x82566900

# UI updates that pass their elements a fixed 1/30 s per update (loaded from the constant pool into f31): the UI
# manager (sub_827BA3B0: HUD, radar, dialogue, result screens), its twin sub_82789708, sub_827B5BC8/827B6690/827B6E40
# and sub_827F7828. Above 30 fps the step is scaled by the game's time step (kernel/timing_hooks.cpp).
[[midasm_hook]]
name = "UiTimeStepHook"
address = 0x827BA410
registers = ["f31"]
after_instruction = true

[[midasm_hook]]
name = "UiTimeStepHook2"
address = 0x8278974C
registers = ["f31"]
after_instruction = true

[[midasm_hook]]
name = "UiTimeStepHook3"
address = 0x827B5C34
registers = ["f31"]
after_instruction = true

[[midasm_hook]]
name = "UiTimeStepHook4"
address = 0x827B66FC
registers = ["f31"]
after_instruction = true

[[midasm_hook]]
name = "UiTimeStepHook5"
address = 0x827B6EAC
registers = ["f31"]
after_instruction = true

[[midasm_hook]]
name = "UiTimeStepHook6"
address = 0x827F7840
registers = ["f31"]
after_instruction = true

# Character movement's limit per update (1.5, 0x820A4130 + 644): sub_82A36F98, sub_82CD1F20, sub_82A5A270.
[[midasm_hook]]
name = "MotionCapHook"
address = 0x82A37794
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
name = "MotionCapHook"
address = 0x82CD2B98
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
name = "MotionCapHook"
address = 0x82A5CA2C
registers = ["f30"]
after_instruction = true

